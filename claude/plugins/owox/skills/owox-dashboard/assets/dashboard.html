<title>__TITLE__</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&amp;family=Space+Mono:wght@400;700&amp;display=swap">
<style>
/* OWOX dashboard engine v1. The page is generic: everything it shows comes from the JSON config
   below and from live query_data_mart calls on the viewer's own OWOX connector. */
:root {
  /* owox.com design system, dark mode: ink ground, 1px lines instead of fills, Signal Yellow for the one call to action,
     blue for metrics, green/yellow/red only for states. */
  --bg-page:#1a1f2e; --bg-elevated:#1f2536; --bg-surface:#242a3b; --bg-nested:#2b3346;
  --border-quiet:#2e374b; --border-default:#3a4358; --border-strong:#4b5570; --border-hover:#6f778d;
  --text-primary:#e9ecf2; --text-secondary:#9ba4b6; --text-muted:#828ea5; --text-decor:#646f87;
  --text-link:#459ce9; --key-figure:#459ce9; --focus-ring:#459ce9;
  --metric:#459ce9; --metric-2:#ab6fe5; --plan:#e9ecf2; --prior:#4b5570; --grid-line:rgba(46,55,75,.55);
  --ok:#4cbb7c; --warn:#f3d16c; --bad:#ed7475; --idle:#828ea5;
  --cta-fill:#f2c94c; --cta-ink:#1a1f2e;
  --font-body:"Roboto", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono:"Space Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --radius:0px; --cell-h:42px;
  color-scheme: dark;
}
body {
  margin:0; background-color: var(--bg-page); color: var(--text-primary);
  font: 400 15.5px/1.6 var(--font-body); -webkit-font-smoothing: antialiased;
}
body.grid-bg {
  background-image: linear-gradient(to right, var(--grid-line) 1px, transparent 1px), linear-gradient(to bottom, var(--grid-line) 1px, transparent 1px);
  background-size: 200px var(--cell-h);
}
.page { overflow-x: clip; max-width: 1240px; margin: 0 auto; padding-block: 32px 56px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 24px; }
.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.mono-label { font: 400 11px/1.5 var(--font-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--text-muted); margin: 0; }
.mono { font: 400 12.5px/1.6 var(--font-mono); }
a { color: var(--text-link); }
:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }
/* Export to Google Sheets: a quiet icon in the block's head, shown on hover or keyboard focus. */
.xport { position: relative; display: inline-flex; flex-shrink: 0; }
.xport__btn { width: 26px; height: 26px; padding: 0; border: 1px solid transparent; border-radius: var(--radius); background: transparent; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; opacity: 0; transition: opacity 120ms; }
.block:hover .xport__btn, .card:hover .xport__btn, .xport__btn:focus-visible, .xport--busy .xport__btn { opacity: 1; }
.card .xport__btn { width: 22px; height: 22px; } .card .xport__btn svg { width: 14px; height: 14px; }
@media (hover: none) { .xport__btn { opacity: 1; } }
.xport__btn:hover { border-color: var(--border-hover); }
.xport__btn svg { width: 16px; height: 16px; display: block; }
.xport__tip { position: absolute; right: 0; top: calc(100% + 6px); white-space: nowrap; background: var(--bg-nested); border: 1px solid var(--border-default); padding: 4px 8px; font: 400 12px/1.4 var(--font-body); color: var(--text-primary); text-transform: none; letter-spacing: 0; display: none; z-index: 6; }
.xport__btn:hover + .xport__tip, .xport__btn:focus-visible + .xport__tip { display: block; }
.xpanel { margin: 0 0 12px; padding: 10px 14px; border: 1px solid var(--border-default); background: var(--bg-nested); font-size: 13.5px; color: var(--text-secondary); display: grid; gap: 6px; }
.xpanel__row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.xpanel ul { margin: 0; padding-left: 1.1em; font: 400 12px/1.6 var(--font-mono); }
.xpanel a { font-weight: 500; }
.xpanel .select { height: 30px; font-size: 13px; }
.btn--sm { height: 30px; padding: 0 12px; font-size: 13px; }
.soft { margin: 6px 0 0; font: 400 12px/1.5 var(--font-mono); color: var(--warn); }
.soft button { background: none; border: 0; padding: 0; margin-left: 6px; color: var(--text-link); font: inherit; cursor: pointer; text-decoration: underline dotted; text-underline-offset: 3px; }
button { font: inherit; }
[hidden] { display: none !important; }

/* Header */
.top { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: end; gap: 12px 24px; }
.top .asof { grid-column: 1 / -1; text-align: left; }
.brand { min-width: 0; }
/* The logo sits on the title's line: centred on it and sized from the title's own font size. */
.brand__row { display: flex; align-items: center; gap: 0.32em; margin-top: 8px; min-width: 0; font: 500 clamp(1.9rem, 4.2vw, 48px)/1.06 var(--font-body); }
.brand__row h1 { margin: 0 !important; font: inherit; letter-spacing: -.03em; min-width: 0; text-wrap: balance; }
.brand__logo { display: block; height: calc(var(--logo-scale, 1) * 0.92em); width: auto; max-width: 4.5em; flex-shrink: 0; object-fit: contain; }
@media (max-width: 680px) { .top { grid-template-columns: minmax(0, 1fr); } }
.top h1 { font: 500 clamp(1.9rem, 4.2vw, 48px)/1.06 var(--font-body); letter-spacing: -.03em; margin: 0; text-wrap: balance; }
.top .lede { margin: 10px 0 0; color: var(--text-secondary); max-width: 66ch; }
.controls { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
.controls__row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.progress { grid-column: 2; justify-self: end; margin: -4px 0 0; color: var(--text-secondary); }
@media (max-width: 680px) { .progress { grid-column: 1; justify-self: start; } }
@media (max-width: 680px) { .controls__row { justify-content: flex-start; } }
.btn { font: 500 15px/1 var(--font-body); height: 40px; padding: 0 20px; background: var(--cta-fill); color: var(--cta-ink); border: 0; border-radius: var(--radius); cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
.btn:hover { box-shadow: inset 0 0 0 1px rgba(255,255,255,.85); }
.btn[disabled] { opacity: .55; cursor: default; box-shadow: none; }
.btn--ghost { background: transparent; color: var(--text-primary); border: 1px solid var(--border-default); }
.select { height: 40px; padding: 0 12px; background: var(--bg-surface); color: var(--text-primary); border: 1px solid var(--border-default); border-radius: var(--radius); font: 400 14px var(--font-body); }
.asof { text-align: right; margin: 0; color: var(--text-muted); }
.summary { margin: 0; padding: 14px 20px; background: var(--bg-surface); border: 1px solid var(--border-default); border-radius: var(--radius); color: var(--text-primary); font-size: 16.5px; }
.summary b { font-family: var(--font-mono); font-weight: 700; font-variant-numeric: tabular-nums; }
.summary p { margin: 0; } .summary p + p { margin-top: 6px; }

/* Tabs */
.tabs { display: flex; gap: 8px; overflow-x: auto; }
.tab { background: var(--bg-elevated); border: 1px solid var(--border-default); border-radius: var(--radius); color: var(--text-secondary); padding: 0 16px; height: 36px; cursor: pointer; font: 400 12px/1 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; white-space: nowrap; }
.tab:hover { border-color: var(--border-hover); color: var(--text-primary); }
.tab[aria-selected="true"] { background: #0b63b8; border-color: #0b63b8; color: #ffffff; }

/* Grid of blocks */
.grid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 24px; }
.span-2 { grid-column: span 2; } .span-3 { grid-column: span 3; } .span-4 { grid-column: span 4; } .span-6 { grid-column: 1 / -1; }
@media (max-width: 980px) { .span-2, .span-3, .span-4 { grid-column: span 3; } }
@media (max-width: 680px) { .grid { grid-template-columns: minmax(0, 1fr); } .span-2, .span-3, .span-4, .span-6 { grid-column: 1 / -1; } }
.block { background: var(--bg-surface); border: 1px solid var(--border-default); border-radius: var(--radius); min-width: 0; display: flex; flex-direction: column; transition: border-color 180ms cubic-bezier(.2,0,.2,1); }
.block:hover { border-color: var(--border-hover); }
.block__head { display: flex; align-items: center; gap: 12px; min-height: var(--cell-h); margin: 0; padding: 0 16px 0 20px; background: var(--bg-nested); border-bottom: 1px solid var(--border-quiet); min-width: 0; }
.block__title { color: var(--text-muted); margin-right: auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.block__body { padding: 16px 20px 20px; min-width: 0; flex: 1; display: flex; flex-direction: column; }
.desc { color: var(--text-muted); font-size: 13px; line-height: 1.5; margin: 10px 0 0; }
.tag { display: inline-block; font: 400 10px/1 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; padding: 3px 5px; border: 1px solid var(--border-default); color: var(--text-secondary); margin-right: 6px; vertical-align: 1px; }

/* Scorecards */
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(178px, 1fr)); gap: 14px; }
.card { background: var(--bg-surface); border: 1px solid var(--border-default); border-top: 3px solid var(--idle); border-radius: var(--radius); padding: 14px 18px 12px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.card details.src { margin-top: auto; }
.card .spark { margin-bottom: 4px; }
.card--ok { border-top-color: var(--ok); } .card--warn { border-top-color: var(--warn); } .card--bad { border-top-color: var(--bad); } .card--idle { border-top-color: var(--idle); }
.card__row { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 16px; }
.card__name { font: 500 15px/1.35 var(--font-body); margin: 0; display: inline-flex; gap: 8px; align-items: center; }
.card__fact { font: 700 clamp(22px, 2.3vw, 28px)/1.05 var(--font-mono); letter-spacing: -.02em; font-variant-numeric: tabular-nums; margin: 2px 0 0; overflow-wrap: anywhere; }
.card__change { font: 400 12.5px/1.5 var(--font-mono); margin: 0; }
.card__lines { margin: 0; padding: 0; list-style: none; font: 400 12px/1.6 var(--font-mono); color: var(--text-secondary); }
.card__lines em { font-style: normal; color: var(--text-muted); }
.up-good { color: var(--ok); } .down-bad { color: var(--bad); } .flat { color: var(--text-muted); }
.status { display: inline-flex; align-items: center; gap: 6px; font: 400 10.5px/1 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; white-space: nowrap; }
.status i { width: 8px; height: 8px; border-radius: 50%; background: currentColor; display: inline-block; }
.status--ok { color: var(--ok); } .status--warn { color: var(--warn); } .status--bad { color: var(--bad); } .status--idle { color: var(--idle); }
.spark { height: 34px; margin-top: 2px; }
.spark svg { width: 100%; height: 34px; display: block; overflow: visible; }

/* Help tooltip */
.help { position: relative; display: inline-flex; flex-shrink: 0; }
.help__btn { width: 18px; height: 18px; border: 1px solid var(--border-default); border-radius: var(--radius); background: transparent; color: var(--text-muted); font: 400 10.5px/1 var(--font-mono); cursor: help; display: inline-flex; align-items: center; justify-content: center; padding: 0; }
.help__pop { position: absolute; left: 0; top: calc(100% + 8px); width: min(300px, 78vw); z-index: 6; background: var(--bg-nested); border: 1px solid var(--border-default); padding: 10px 14px; color: var(--text-secondary); font: 400 13px/1.55 var(--font-body); text-transform: none; letter-spacing: 0; display: none; }
.help:hover .help__pop, .help:focus-within .help__pop { display: block; }
.help__pop p { margin: 0; } .help__pop p + p { margin-top: 6px; color: var(--text-muted); font: 400 11.5px/1.5 var(--font-mono); }

/* Charts */
.chart { position: relative; min-height: 120px; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart text { fill: var(--text-muted); font: 400 10.5px var(--font-mono); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; margin: 0 0 8px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; font: 400 11.5px var(--font-mono); color: var(--text-secondary); }
.legend i { width: 14px; height: 10px; display: inline-block; background: var(--metric); }
.legend i.line { height: 0; border-top: 2px solid var(--metric); background: none; }
.legend i.plan { height: 0; border-top: 2px dashed var(--plan); background: none; }
.legend i.prior { background: var(--prior); }
.legend i.fc { background: none; border: 1px dashed var(--metric); }
.tip { position: absolute; pointer-events: none; background: var(--bg-nested); border: 1px solid var(--border-default); padding: 6px 10px; font: 400 12px/1.5 var(--font-mono); color: var(--text-primary); white-space: nowrap; z-index: 4; }
.empty, .loading { color: var(--text-muted); padding: 12px 0; margin: 0; }
.state { margin: 0; padding: 10px 14px; border: 1px solid var(--border-default); font-size: 14px; color: var(--text-secondary); display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.state--bad { border-color: var(--bad); } .state--warn { border-color: var(--warn); }

/* Source (collapsed) */
details.src { margin-top: 12px; border-top: 1px dashed var(--border-quiet); padding-top: 8px; font: 400 11.5px/1.6 var(--font-mono); color: var(--text-muted); }
details.src > summary { cursor: pointer; list-style: none; display: inline-flex; gap: 6px; align-items: center; color: var(--text-muted); text-decoration: underline dotted; text-underline-offset: 3px; }
details.src > summary::-webkit-details-marker { display: none; }
details.src > summary::before { content: "+"; color: var(--text-decor); }
details.src[open] > summary::before { content: "−"; }
.src__grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px 20px; margin-top: 10px; }
.src__role { margin: 0; font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--text-decor); }
.src__mart { color: var(--text-secondary); display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.src__via { color: var(--text-decor); font-size: 10.5px; margin: 0; }
details.src ul { margin: 2px 0 0; padding-left: 1.1em; }
details.src li a { color: var(--text-muted); text-decoration: none; }
details.src li a:hover { color: var(--text-primary); text-decoration: underline dotted; }
details.src ul.src__kinds { list-style: none; padding: 0; margin: 8px 0 0; display: grid; gap: 4px; font-family: var(--font-body); font-size: 12.5px; color: var(--text-secondary); }
details.src .src__text { margin: 2px 0 0; color: var(--text-secondary); font-family: var(--font-body); font-size: 12.5px; }
.linkbtn { background: none; border: 0; padding: 0; margin-top: 10px; color: var(--text-muted); cursor: pointer; text-decoration: underline dotted; text-underline-offset: 3px; font: inherit; }
.linkbtn:hover { color: var(--text-primary); }

/* Drivers */
.drivers { display: grid; gap: 10px; }
.drivers__bar { display: flex; justify-content: flex-end; gap: 12px; }
details.ins { border: 1px solid var(--border-default); border-left: 3px solid var(--idle); background: var(--bg-surface); border-radius: var(--radius); }
details.ins.ins--ok { border-left-color: var(--ok); } details.ins.ins--bad { border-left-color: var(--bad); }
details.ins > summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: auto minmax(0, 1fr) auto 110px 26px; gap: 12px; align-items: center; padding: 10px 14px; }
details.ins:hover .xport__btn { opacity: 1; }
.xport__btn.dig { color: var(--text-secondary); }
.dig__fallback { width: 100%; min-height: 120px; background: var(--bg-nested); color: var(--text-primary); border: 1px solid var(--border-default); font: 400 12px/1.5 var(--font-mono); }
details.ins > summary::-webkit-details-marker { display: none; }
.ins__id { font: 400 11px var(--font-mono); color: var(--text-decor); }
.ins__title { margin: 0; font-weight: 500; min-width: 0; }
.ins__impact { font: 700 14px var(--font-mono); }
.ins__body { padding: 4px 14px 14px; display: grid; gap: 8px; font-size: 14px; color: var(--text-secondary); }
.ins__body h4 { margin: 0 0 2px; font: 400 10.5px/1.4 var(--font-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--text-muted); }
.ins__body p, .ins__body ul { margin: 0; } .ins__body ul { padding-left: 1.1em; }
@media (max-width: 560px) { details.ins > summary { grid-template-columns: minmax(0, 1fr) auto; } .ins__id, .ins .spark { display: none; } }

/* Table */
.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { padding: 7px 10px; border-bottom: 1px solid var(--border-quiet); text-align: right; white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
th { font: 400 10.5px/1.5 var(--font-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--text-muted); cursor: pointer; user-select: none; }
td.num { font-size: 12.5px; }

/* Notes and log */
.data__h { margin: 18px 0 6px; }
.notes { margin: 0; padding-left: 1.2em; display: grid; gap: 6px; color: var(--text-secondary); font-size: 14px; max-width: 95ch; }
details.about > summary, details.log > summary { cursor: pointer; list-style: none; display: flex; align-items: center; gap: 12px; min-height: var(--cell-h); padding: 0 20px; background: var(--bg-nested); color: var(--text-muted); }
details.about > summary::-webkit-details-marker, details.log > summary::-webkit-details-marker { display: none; }
details.about > summary::before, details.log > summary::before { content: "+"; font-family: var(--font-mono); color: var(--text-decor); }
details.about[open] > summary::before, details.log[open] > summary::before { content: "−"; }
.run { border-bottom: 1px solid var(--border-quiet); padding: 10px 0; }
.run:last-child { border-bottom: 0; }
.run__head { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: baseline; }
.call { display: grid; gap: 4px; margin-top: 10px; padding-left: 14px; border-left: 1px solid var(--border-default); }
.call.is-target { border-left: 3px solid var(--metric); background: color-mix(in srgb, var(--metric) 10%, transparent); padding: 8px 12px; }
.call__line { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: baseline; }
pre.cfg { margin: 0; padding: 8px 12px; background: var(--bg-nested); border: 1px solid var(--border-quiet); font: 400 11.5px/1.5 var(--font-mono); color: var(--text-secondary); overflow-x: auto; white-space: pre; }
.ok { color: var(--ok); } .bad { color: var(--bad); } .warn { color: var(--warn); }
@media (prefers-reduced-motion: reduce) { .block, .help__pop { transition: none; } }
__THEME_CSS__
</style>

<div class="page" id="page">
  <header class="top">
    <div class="brand">
      <p class="mono-label" id="kicker"></p>
      <div class="brand__row">
        <img class="brand__logo" id="logo" alt="" hidden>
        <h1 id="title"></h1>
      </div>
    </div>
    <div class="controls__row">
      <select class="select" id="period" aria-label="Period"></select>
      <button class="btn" id="refresh" type="button" disabled>Refresh data</button>
    </div>
    <p class="mono progress" id="progress" hidden></p>
    <p class="mono asof" id="asof">Connecting to OWOX…</p>
  </header>
  <p class="state" id="page-state" hidden></p>
  <div class="summary" id="summary" hidden></div>
  <nav class="tabs" id="tabs" role="tablist" hidden></nav>
  <main id="pages"></main>
  <details class="block about" id="about">
    <summary><span class="mono-label">About these numbers</span></summary>
    <div class="block__body" id="about-body"></div>
  </details>
  <details class="block log" id="log">
    <summary><span class="mono-label">Run log · the last 20 data loads and the exact OWOX queries</span></summary>
    <div class="block__body" id="log-body"><p class="empty">No runs recorded yet.</p></div>
  </details>
</div>

<script type="application/json" id="owox-dashboard-config">__CONFIG__</script>
<script>
(() => {
  "use strict";
  const CFG = JSON.parse(document.getElementById("owox-dashboard-config").textContent);
  const SERVER = CFG.connector;
  const TOOL = "query_data_mart";
  const APP = (CFG.app_url || "https://app.owox.com").replace(/\/$/, "");
  const PROJECT = CFG.project || {};
  const TZ = CFG.time_zone || "UTC";
  const LOCALE = CFG.locale || "en-US";
  const CURRENCY = CFG.currency || "USD";
  const QUERIES = CFG.queries || {};
  const METRICS = CFG.metrics || {};
  const PAGES = CFG.pages || [];
  const COMPONENTS = {};
  PAGES.forEach((p) => (p.components || []).forEach((c, i) => { c.id = c.id || `${p.id || p.title}-${i}`; COMPONENTS[c.id] = c; }));

  // ---------- small helpers ----------
  const $ = (id) => document.getElementById(id);
  const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
  const NS = "http://www.w3.org/2000/svg";
  const svgEl = (tag, attrs) => { const n = document.createElementNS(NS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); return n; };
  const isNum = (v) => typeof v === "number" && isFinite(v);

  // ---------- theme: dark first, light when the viewer's theme asks for it (CSS tokens) ----------
  if (!(CFG.theme && CFG.theme.grid === false)) document.body.classList.add("grid-bg");

  // ---------- dates (ISO day strings, UTC math) ----------
  const D = {
    parse(s) { return new Date(s + "T00:00:00Z"); },
    iso(d) { return d.toISOString().slice(0, 10); },
    add(s, n) { const d = D.parse(s); d.setUTCDate(d.getUTCDate() + n); return D.iso(d); },
    year(s) { return +s.slice(0, 4); }, month(s) { return +s.slice(5, 7); },

      go.addEventListener("click", () => { if (sel.value === "__new") { connectSheets(c); return; } const d = st.choose.find((x) => x.id === sel.value); const saved = xread(); saved.destination = d.id; xwrite(saved); runExport(c, d); });
      const x = el("button", "linkbtn", "Cancel"); x.type = "button"; x.style.marginTop = "0"; x.addEventListener("click", () => { delete xstate[c.id]; renderAll(); });
      row.append(sel, go, x); p.append(row);
      return p;
    }
    p.append(el("div", null, st.title || ""));
    if (st.steps && st.steps.length) { const ul = el("ul"); st.steps.forEach((t) => ul.append(el("li", null, t))); p.append(ul); }
    if (st.link) { const a = el("a", null, "Open in Google Sheets ↗"); a.href = st.link; a.target = "_blank"; a.rel = "noopener"; p.append(a); }
    if (st.error) p.append(el("p", "state state--bad", st.error));
    if (!st.busy && st.denied) { const go = el("button", "btn btn--sm", "Connect my own Google Sheets"); go.type = "button"; go.addEventListener("click", () => connectSheets(c)); p.append(go); }
    if (!st.busy) { const x = el("button", "linkbtn", "Close"); x.type = "button"; x.style.marginTop = "0"; x.addEventListener("click", () => { delete xstate[c.id]; renderAll(); }); p.append(x); }
    return p;
  }
  async function call(tool, input) {
    try { const r = await mcp.callTool(SERVER, tool, input, { cache: false }); return { ok: true, v: r.payload }; }
    catch (e) { let body = null; try { body = JSON.parse(e.message); } catch (_) {} return { ok: false, e, body }; }
  }
  function exportError(r) {
    const e = r.e || {}; const code = r.body && r.body.error_code;
    if (e.code === "approval_required" || e.code === "not_in_manifest") return `Exporting needs your permission for OWOX report tools on this page: allow them when claude.ai asks, or set add_report and update_report to "Always allow" for ${SERVER} in claude.ai Settings → Connectors.`;
    if (code === "permission_denied") return `Your ${SERVER} connector cannot export this Data Mart: your project role may have no access, or this Google Sheets destination is not shared with you.`;
    return (r.body && r.body.message) || errorCopy(e);
  }
  async function startExport(c) {
    if (!mcp || (xstate[c.id] && xstate[c.id].busy)) return;
    xstate[c.id] = { busy: true, title: "Finding your Google Sheets destination…", steps: [] }; renderAll();
    const r = await call("list_destinations", {});
    if (!r.ok) { xstate[c.id] = { busy: false, error: exportError(r) }; renderAll(); return; }
    const sheets = ((r.v && r.v.destinations) || []).filter((d) => d.type === "google_sheets" && d.connectedGoogleAccount);
    xstate[c.id].known = ((r.v && r.v.destinations) || []).map((d) => d.id);
    if (!sheets.length) { xstate[c.id] = { busy: false, known: xstate[c.id].known, offerConnect: "You have no Google Sheets destination in this OWOX project yet. Connect your Google account once, and every export goes to your own Drive." }; renderAll(); return; }
    const saved = xread(); const pick = sheets.find((d) => d.id === saved.destination) || (sheets.length === 1 ? sheets[0] : null);
    if (!pick) { xstate[c.id] = { busy: false, choose: sheets, known: xstate[c.id].known }; renderAll(); return; }
    runExport(c, pick);
  }
  // No usable destination: OWOX gives a link to its "Connect Google Sheets" page; the viewer signs in to Google
  // there, the destination appears, and the page picks the new one by comparing the list before and after.
  async function connectSheets(c) {
    const known = (xstate[c.id] && xstate[c.id].known) || [];
    xstate[c.id] = { busy: true, title: "Asking OWOX for the Google connection page…", steps: [], known }; renderAll();
    const r = await call("add_destination", { destination_type: "google_sheets" });
    const url = r.ok && r.v && r.v.authorization_url;
    if (!url) { xstate[c.id] = { busy: false, known, error: r.ok ? "OWOX did not return a connection page." : exportError(r) }; renderAll(); return; }
    xstate[c.id] = { busy: false, known, connect: { url } }; renderAll();
  }
  async function afterConnect(c) {
    const st = xstate[c.id]; const known = new Set(st.known || []);
    st.error = null; renderAll();
    const r = await call("list_destinations", {});
    if (!r.ok) { st.error = exportError(r); renderAll(); return; }
    const all = (r.v && r.v.destinations) || [];
    const fresh = all.filter((d) => d.type === "google_sheets" && d.connectedGoogleAccount && !known.has(d.id));
    if (!fresh.length) { st.error = "No new Google Sheets destination yet. Finish the Google sign-in on the OWOX page, then press Done again."; renderAll(); return; }
    if (fresh.length > 1) { xstate[c.id] = { busy: false, choose: fresh, known: all.map((d) => d.id) }; renderAll(); return; }
    const saved = xread(); saved.destination = fresh[0].id; xwrite(saved);
    runExport(c, fresh[0]);
  }
  async function runExport(c, dest) {
    const parts = exportParts(c);
    const w = anchor ? PERIODS[period].win(anchor) : null;
    const st = xstate[c.id] = { busy: true, title: `Exporting ${parts.length === 1 ? "1 table" : parts.length + " tables"} to Google Sheets (${dest.name})…`, steps: [] };
    renderAll();
    const saved = xread(); const key = `${c.id}:${dest.id}`; const mem = saved[key] || { reports: {} };
    let spreadsheet = mem.spreadsheet_id || null, link = mem.sheet_url || null; const runs = [];
    for (const part of parts) {
      const name = sheetName(`${c.title || c.id} · ${part.label}`);
      const controls = { fields: part.input.fields };
      ["filters", "aggregations", "date_buckets", "sort", "slices"].forEach((k) => { if (part.input[k] && part.input[k].length) controls[k] = part.input[k]; });
      let res = null, reportId = mem.reports[part.id];
      if (reportId) {
        res = await call("update_report", Object.assign({ report_id: reportId }, controls, { filters: controls.filters || [] }));
        if (!res.ok && !(res.body && res.body.error_code === "permission_denied")) { reportId = null; }
      }
      if (!reportId) {
        res = await call("add_report", Object.assign({ data_mart_id: part.data_mart_id, destination_id: dest.id, name }, controls, spreadsheet ? { spreadsheet_id: spreadsheet } : {}));
        if (!res.ok && res.body && res.body.error_code === "similar_report_exists" && res.body.existing_report) {
          reportId = res.body.existing_report.report_id;
          res = await call("update_report", Object.assign({ report_id: reportId }, controls, { filters: controls.filters || [] }));
        }
      }
      if (!res.ok) {
        st.error = exportError(res); st.steps.push(`${part.label}: not exported`);
        if (res.body && res.body.error_code === "permission_denied") { st.denied = true; const sv = xread(); delete sv.destination; xwrite(sv); break; }
        renderAll(); continue;
      }
      const v = res.v || {}; reportId = v.report_id || reportId; mem.reports[part.id] = reportId;
      spreadsheet = spreadsheet || v.spreadsheet_id || null; link = link || v.sheet_url || null; if (v.spreadsheet_id) mem.spreadsheet_id = v.spreadsheet_id; if (v.sheet_url && !mem.sheet_url) mem.sheet_url = v.sheet_url;
      const outcome = v.initial_run || v.run || {};
      let runId = outcome.status === "queued" ? outcome.run_id : null;
      if (!runId && outcome.status === "not_requested") { const rr = await call("run_report", { report_id: reportId }); if (rr.ok && rr.v) runId = rr.v.run_id; }
      st.steps.push(`${part.label}: ${runId ? "running…" : "saved"}`);
      runs.push({ i: st.steps.length - 1, label: part.label, report_id: reportId, run_id: runId });
      saved[key] = mem; xwrite(saved); renderAll();
    }
    st.link = link; renderAll();
    // Follow each run to its end (OWOX report runs can take a minute or more).
    const started = Date.now();
    for (const r of runs.filter((x) => x.run_id)) {
      let done = false;
      while (!done && Date.now() - started < 6 * 60e3) {
        await new Promise((ok) => setTimeout(ok, 5000));
        const s1 = await call("get_report_run_status", { report_id: r.report_id, run_id: r.run_id });
        if (!s1.ok) { st.steps[r.i] = `${r.label}: status unknown`; break; }
        const v = s1.v || {};
        if (!v.should_poll) { done = true; st.steps[r.i] = `${r.label}: ${v.status === "success" ? "done" : v.status + (v.error ? " · " + String(v.error).slice(0, 120) : "")}`; }
        renderAll();
      }
    }
    st.busy = false;
    st.title = st.error ? "Export finished with problems." : `Exported${w ? " for " + winLabel(w.cur) : ""}. The reports stay in OWOX, so you can re-run or schedule them there.`;
    renderAll();
  }

  // ---------- run log (shared through db: who refreshed, when, which exact queries) ----------
  let db = null, me = null, userApi = null, run = null, local = [], shared = [];
  function startRun(trigger, calls) {
    if (run && !run.written) finishRun();
    run = { trigger, startedAt: Date.now(), expected: new Set(calls.map((c) => c.key)), calls: {}, written: false };
    clearTimeout(startRun.t); startRun.t = setTimeout(finishRun, 240000);
  }
  function noteCall(c, ev) {
    if (!run || !run.expected.has(c.key)) return;
    const q = QUERIES[c.qid];
    const entry = { key: c.key, label: (q.label || c.qid) + (c.window ? ` · ${c.window === "cur" ? "this period" : "comparison"}` : ""), server: SERVER, tool: TOOL, input: JSON.stringify(c.input, null, 2), afterMs: Date.now() - run.startedAt, ms: c.startedAt ? Date.now() - c.startedAt : null, retried: !!c.retried };
    if (ev.type === "data") { if (ev.result.cache && ev.result.cache.revalidating) return; const t = store[c.key].table; entry.status = ev.result.cache ? "cache" : "ok"; entry.rows = t ? t.rows.length : null; entry.sourceUpdatedAt = t ? t.updated : null; }
    else { entry.status = "error"; entry.code = ev.error.code; entry.message = String(ev.error.message || "").slice(0, 300); }
    run.calls[c.key] = entry;
    if ([...run.expected].every((k) => run.calls[k])) finishRun();
  }
  async function finishRun() {
    if (!run || run.written) return; run.written = true; clearTimeout(startRun.t);
    const calls = Object.values(run.calls);
    if (!calls.length || calls.every((c) => c.status === "cache")) return;
    const doc = { at: new Date(run.startedAt).toISOString(), trigger: run.trigger, by: me, calls };
    local.unshift(doc); renderLog();
    if (db) { try { await db.collection("runs").add(doc); } catch (_) { /* viewers who cannot write keep a local log */ } }
  }
  async function renderLog() {
    const body = $("log-body");
    const seen = new Set(shared.map((r) => r.at + (r.by || "")));
    const runs = [...shared, ...local.filter((r) => !seen.has(r.at + (r.by || "")))].sort((a, b) => b.at.localeCompare(a.at)).slice(0, 20);
    body.replaceChildren();
    if (!runs.length) { body.append(el("p", "empty", "No runs recorded yet.")); return; }
    let names = {};
    if (userApi) { try { const ids = [...new Set(runs.map((r) => r.by).filter(Boolean))]; if (ids.length) names = await userApi.profiles(ids); } catch (_) {} }
    runs.forEach((r) => {
      const box = el("div", "run"); const head = el("div", "run__head");
      const okN = r.calls.filter((c) => c.status === "ok").length, errN = r.calls.filter((c) => c.status === "error").length;
      const trig = { open: "Page open", refresh: "Manual refresh", retry: "Retry of failed queries", period: "Period change", anchor: "New data day", tab: "Tab opened" }[r.trigger] || r.trigger;
      head.append(el("span", "num", fmtStamp(r.at)), el("span", "mono-label", trig), el("span", "mono", (r.by && names[r.by] && names[r.by].name) || (r.by && r.by === me ? "you" : "a viewer")), el("span", "mono " + (errN ? "bad" : "ok"), `${okN} fresh · ${r.calls.length - okN - errN} cached · ${errN} failed`));
      box.append(head);
      r.calls.forEach((c) => {
        const call = el("div", "call"); call.dataset.key = c.key;
        const line = el("div", "call__line");
        line.append(el("span", "mono " + (c.status === "error" ? "bad" : c.status === "cache" ? "warn" : "ok"), c.status === "error" ? `error · ${c.code}` : c.status === "cache" ? "cached" : "ok"), el("span", null, c.label), el("span", "mono", `${c.server} → ${c.tool}`));
        if (c.rows != null) line.append(el("span", "mono", `${c.rows} rows`));
        if (c.ms != null) line.append(el("span", "mono", `${(c.ms / 1000).toFixed(1)} s${c.retried ? " · second try" : ""}`));
        if (c.sourceUpdatedAt) line.append(el("span", "mono", `source updated ${fmtStamp(c.sourceUpdatedAt)}`));
        call.append(line);
        if (c.message) call.append(el("p", "desc", c.message));
        call.append(el("pre", "cfg", c.input));
        box.append(call);
      });
      body.append(box);
    });
  }
  function openLog(keys, title) {
    const log = $("log"); log.open = true;
    document.querySelectorAll(".call.is-target").forEach((n) => n.classList.remove("is-target"));
    const first = document.querySelector("#log-body .run");
    if (first) keys.forEach((k) => first.querySelectorAll(`.call[data-key="${CSS.escape(k)}"]`).forEach((n) => n.classList.add("is-target")));
    (first || log).scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" });
  }

  // ---------- project check: this page reads one OWOX project ----------
  let projectMismatch = null;
  function checkProject() {
    if (!PROJECT.id) return;
    mcp.watchTool(SERVER, "get_project_context", null, (ev) => {
      if (ev.type !== "data") return;
      const p = ev.result.payload && ev.result.payload.current_project;
      projectMismatch = p && p.id && p.id !== PROJECT.id ? `Your ${SERVER} connector is signed in to the project "${p.title}". This dashboard reads "${PROJECT.title}". Disconnect and reconnect ${SERVER} in claude.ai Settings → Connectors and choose "${PROJECT.title}".` : null;
      pageLevelState();
    }, { cache: { staleTime: 300000, gcTime: 3600000 } });
  }

  // ---------- wiring ----------
  $("title").textContent = CFG.title || "Dashboard";
  // The logo arrives inlined by build_page.py (a data: URI): artifacts load no images from other hosts.
  if (CFG._logo && /^data:image\/(svg\+xml|png|webp|jpeg|gif);base64,/.test(CFG._logo.src)) {
    const img = $("logo"); img.src = CFG._logo.src; img.alt = CFG._logo.alt || ""; img.hidden = false;
    if (CFG._logo.scale) document.documentElement.style.setProperty("--logo-scale", String(Math.max(0.5, Math.min(1.5, +CFG._logo.scale))));
  }
  $("kicker").textContent = CFG.kicker || [PROJECT.title, CFG.context].filter(Boolean).join(" · ");
  (function about() {
    if (PAGES.some((p) => (p.components || []).some((k) => k.type === "data"))) { $("about").hidden = true; return; }
    const body = $("about-body");
    body.append(el("p", "desc", CFG.lede || `Every number is read live from OWOX Data Marts through your own ${SERVER} connector, on open and on Refresh.`));
    const notes = PAGES.flatMap((p) => p.components || []).filter((c) => c.type === "notes").flatMap((c) => c.items || []);
    if (notes.length) { const ol = el("ol", "notes"); notes.forEach((t) => ol.append(el("li", null, t))); body.append(ol); }
    const more = CFG.improvements || [];
    if (more.length) {
      body.append(el("p", "mono-label", "Get more from this dashboard"));
      const ul = el("ul", "notes");
      more.forEach((x) => { const li = el("li"); li.append(document.createTextNode(x.text || String(x))); if (x.data_mart_id) { const a = el("a", null, " Open in OWOX ↗"); a.href = martUrl(x.data_mart_id, x.field); a.target = "_blank"; a.rel = "noopener"; li.append(a); } ul.append(li); });
      body.append(ul);
    }
  })();
  const sel = $("period");
  if (!CFG.anchor) sel.hidden = true;
  periodKeys.forEach((k) => { const o = el("option", null, PERIODS[k].label); o.value = k; if (k === period) o.selected = true; sel.append(o); });
  sel.addEventListener("change", () => { period = sel.value; syncWatches("period"); });
  if (PAGES.length > 1) {
    const tabs = $("tabs"); tabs.hidden = false;
    PAGES.forEach((p, i) => { const b = el("button", "tab", p.title); b.type = "button"; b.setAttribute("role", "tab"); b.setAttribute("aria-selected", i === activePage ? "true" : "false"); b.addEventListener("click", () => { activePage = i; tabs.querySelectorAll(".tab").forEach((t, j) => t.setAttribute("aria-selected", j === i ? "true" : "false")); if (!visited.has(i)) { visited.add(i); syncWatches("tab"); } renderAll(); }); tabs.append(b); });
  }
  renderAll();
  (async () => {
    mcp = window.claude && window.claude.use ? await window.claude.use("mcp") : null;
    if (!mcp) { $("asof").textContent = "Live data needs claude.ai: open this page there."; return; }
    checkProject();
    visited.add(activePage);
    syncWatches("open");
    const btn = $("refresh"); btn.disabled = false;
    btn.addEventListener("click", async () => {
      btn.disabled = true; btn.textContent = "Refreshing…";
      // Refresh re-runs the opened tabs' queries through the same queue, so it never bursts.
      ai = {}; cycle = null;   // new data, new recommendations
      syncWatches("refresh", true);
    });
  })();
  (async () => {
    if (!(window.claude && window.claude.use)) return;
    const [d, u] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    db = d; userApi = u;
    try { sampleFn = await window.claude.use("sample"); if (sampleFn) renderAll(); } catch (_) { sampleFn = null; }
    if (u) { try { me = await u.id(); } catch (_) {} }
    if (!db) return;
    db.collection("runs").orderBy("at", "desc").limit(20).onSnapshot((snap) => {
      shared = snap.docs.map((x) => x.data()).filter((r) => r && r.at && Array.isArray(r.calls));
      renderLog();
    }, () => {});
  })();
})();
</script>
